<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playrunner workflow editor</title>
    <!-- WORKFLOW_CANVAS_STYLES -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font:
          14px system-ui,
          sans-serif;
      }
      header,
      footer {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 16px;
      }
      header {
        border-bottom: 1px solid var(--border);
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .heading {
        flex: 1;
        min-width: 180px;
      }
      p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      header button,
      footer button {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        color: var(--foreground);
        background: var(--surface);
        cursor: pointer;
        font: inherit;
      }
      header button:hover,
      header button:focus-visible,
      footer button:hover,
      footer button:focus-visible {
        outline: 2px solid var(--muted);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #canvas {
        height: 440px;
        min-height: 320px;
      }
      .preview-node:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      .preview-node p {
        margin: 0;
      }
      @media (min-height: 700px) {
        :root[data-display-mode="fullscreen"] #canvas {
          height: calc(100vh - 155px);
        }
      }
      #selection {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        overflow-wrap: anywhere;
      }
      #selection:empty {
        display: none;
      }
      footer {
        border-top: 1px solid var(--border);
      }
      #status {
        flex: 1;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="heading">
        <h1 id="title">Workflow editor</h1>
        <p id="summary">Waiting for the saved workflow…</p>
      </div>
      <button id="fit" type="button">Fit graph</button>
      <button id="expand" type="button" hidden>Expand</button>
    </header>
    <main id="canvas" aria-label="Saved workflow preview"></main>
    <div id="selection" aria-live="polite"></div>
    <footer>
      <span id="status" role="status">Connecting to Playrunner…</span
      ><button id="refresh" type="button" disabled>Refresh</button
      ><button id="pause" type="button" disabled>Pause updates</button>
    </footer>
    <!-- WORKFLOW_CANVAS_SCRIPT -->
    <script type="module">
      const byId = (id) => document.getElementById(id);
      const pending = new Map();
      let sequence = 0,
        snapshot,
        ready = false,
        paused = false,
        disposed = false,
        busy = false,
        timer,
        failures = 0,
        fingerprint = "";
      const notify = (method, params = {}) =>
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      function request(method, params) {
        const id = ++sequence;
        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            pending.delete(id);
            reject(new Error("The host did not respond."));
          }, 15000);
          pending.set(id, { resolve, reject, timeout });
          window.parent.postMessage(
            { jsonrpc: "2.0", id, method, params },
            "*",
          );
        });
      }
      function theme(context) {
        if (context?.theme)
          document.documentElement.classList.toggle(
            "dark",
            context.theme === "dark",
          );
        if (context?.displayMode)
          document.documentElement.dataset.displayMode = context.displayMode;
        if (context?.availableDisplayModes)
          byId("expand").hidden =
            !context.availableDisplayModes.includes("fullscreen");
      }
      function render(workflow, fit = false) {
        window.renderWorkflowCanvas(workflow, fit, (node) => {
          byId("selection").textContent = `${node.label} · ${node.nodeType}`;
          request("ui/update-model-context", {
            content: [
              {
                type: "text",
                text: `Selected workflow ${workflow.id}, node ${node.id}.`,
              },
            ],
          }).catch(() => {});
        });
        byId("title").textContent = workflow.title || "Workflow editor";
        byId("summary").textContent =
          `${workflow.nodes.length} nodes · ${workflow.connections.length} connections · Live preview`;
      }
      function accept(data) {
        if (
          !data?.workflow?.id ||
          !Array.isArray(data.workflow.nodes) ||
          !Array.isArray(data.workflow.connections)
        )
          throw new Error("The server did not return a workflow graph.");
        if (
          snapshot &&
          (data.workflow.id !== snapshot.workflow.id ||
            data.serverId !== snapshot.serverId)
        )
          return;
        const next = JSON.stringify(data.workflow);
        if (next !== fingerprint) {
          render(data.workflow, !snapshot);
          fingerprint = next;
        }
        snapshot = data;
        failures = 0;
        byId("refresh").disabled = !ready;
        byId("pause").disabled = !ready;
        byId("status").textContent = paused
          ? "Updates paused"
          : "Following saved changes";
      }
      function schedule() {
        clearTimeout(timer);
        if (ready && snapshot && !paused && !disposed)
          timer = setTimeout(() => refresh(), 1500);
      }
      async function refresh() {
        if (!ready || !snapshot || busy || disposed) return;
        if (document.hidden) {
          schedule();
          return;
        }
        busy = true;
        try {
          const result = await request("tools/call", {
            name: "get_workflow_editor",
            arguments: {
              workflowId: snapshot.workflow.id,
              ...(snapshot.serverId ? { serverId: snapshot.serverId } : {}),
            },
          });
          if (result?.isError)
            throw new Error("Refresh failed. Check access, then retry.");
          accept(result.structuredContent);
        } catch (error) {
          failures++;
          byId("status").textContent =
            `${error.message} Showing the last saved snapshot.`;
          if (failures >= 3) {
            paused = true;
            byId("pause").textContent = "Resume updates";
          }
        } finally {
          busy = false;
          schedule();
        }
      }
      byId("fit").onclick = () => {
        if (snapshot) render(snapshot.workflow, true);
      };
      byId("refresh").onclick = () => refresh();
      byId("pause").onclick = () => {
        paused = !paused;
        failures = 0;
        byId("pause").textContent = paused ? "Resume updates" : "Pause updates";
        byId("status").textContent = paused
          ? "Updates paused"
          : "Following saved changes";
        schedule();
      };
      byId("expand").onclick = () =>
        request("ui/request-display-mode", { mode: "fullscreen" }).catch(() => {
          byId("status").textContent =
            "Expanded view is unavailable in this host.";
        });
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent || event.data?.jsonrpc !== "2.0")
          return;
        const message = event.data;
        if (pending.has(message.id)) {
          const item = pending.get(message.id);
          pending.delete(message.id);
          clearTimeout(item.timeout);
          if (message.error)
            item.reject(
              new Error(message.error.message || "Host request failed."),
            );
          else item.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result") {
          try {
            if (message.params?.isError)
              throw new Error("Unable to open this workflow.");
            accept(message.params?.structuredContent);
            schedule();
          } catch (error) {
            byId("status").textContent = error.message;
          }
        }
        if (message.method === "ui/notifications/host-context-changed")
          theme(message.params);
        if (message.method === "ui/resource-teardown") {
          disposed = true;
          resize.disconnect();
          clearTimeout(timer);
          window.parent.postMessage(
            { jsonrpc: "2.0", id: message.id, result: {} },
            "*",
          );
        }
      });
      const resize = new ResizeObserver(() => {
        if (ready && !disposed)
          notify("ui/notifications/size-changed", {
            height: document.body.scrollHeight,
          });
      });
      resize.observe(document.body);
      window.addEventListener("pagehide", () => {
        disposed = true;
        clearTimeout(timer);
      });
      request("ui/initialize", {
        appInfo: { name: "Playrunner workflow editor", version: "1.1.0" },
        appCapabilities: {},
        protocolVersion: "2026-01-26",
      })
        .then((result) => {
          ready = true;
          theme(result.hostContext);
          notify("ui/notifications/initialized");
          notify("ui/notifications/size-changed", {
            height: document.body.scrollHeight,
          });
          byId("refresh").disabled = !snapshot;
          byId("pause").disabled = !snapshot;
          schedule();
        })
        .catch(() => {
          byId("status").textContent =
            "Live updates require an MCP Apps host. The saved workflow remains available through the tools.";
        });
    </script>
  </body>
</html>
